<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colibri application starter</title>
  <link rel="stylesheet" href="./__COLIBRI__/css/colibri.css">
  <link rel="stylesheet" href="./__COLIBRI__/themes/colibri.css">
  <link rel="stylesheet" href="./__COLIBRI__/css/colibri-ui-bridge.css">
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body class="ui-root">
  <main class="app-shell stack" data-gap="l">
    <header class="cluster"><h1>Project settings</h1><button id="theme" type="button" aria-pressed="false">Dark mode</button></header>
    <p>Edit the project name. This starter saves locally in your browser; connect the form to your API for shared data.</p>
    <form id="settings" class="stack" data-gap="m">
      <label for="project-name">Project name</label>
      <input id="project-name" name="name" required maxlength="80" autocomplete="organization" value="My project">
      <button type="submit">Save settings</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <div data-ui="dialog" id="help">
      <button type="button" data-ui-part="trigger">Integration notes</button>
      <dialog data-ui-part="content">
        <h2 data-ui-part="title">Connect your application</h2>
        <p data-ui-part="description">Replace the local save in app.js with your API request. Keep validation and authorization on the server.</p>
        <button type="button" data-ui-part="close">Close</button>
      </dialog>
    </div>
  </main>
</body>
</html>

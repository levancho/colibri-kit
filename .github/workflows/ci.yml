name: Library checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: npm ci --ignore-scripts
      - run: npm run test:java
      - run: npm test
      - run: npm run test:react-compat
        env:
          REACT_VERSION: 18.3.1
      - run: npm run build
      - run: npm run check:architecture
      - run: npm run check:contrast
        env:
          CHROME: /usr/bin/google-chrome
      - run: npm run test:consumer
        env:
          CHROME: /usr/bin/google-chrome
      - run: npm run test:e2e
        env:
          CHROME: /usr/bin/google-chrome
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:cross-browser
      - run: git diff --exit-code -- packages/colibri-css/dist dist src/core/lazy-registry.js skills/colibri-kit/reference/components.md site/dist examples/kitchen-sink.html registry/colibri.json themes/knobs.css README.md
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: colibri-site
          path: site/dist
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: colibri-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: colibri-site
          path: site/dist
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure the CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
      - name: Deploy tested site to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: deploy --config site/wrangler.jsonc
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed release and application assets
        run: node tools/site-manifest.mjs verify site/dist https://colibri.l3v.ai/

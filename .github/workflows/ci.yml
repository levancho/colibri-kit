name: Library checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run check:architecture
      - run: npm run test:e2e
        env:
          CHROME: /usr/bin/google-chrome
      - run: git diff --exit-code -- packages/colibri-css/dist site/dist examples/kitchen-sink.html registry/colibri.json themes/knobs.css README.md
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: colibri-site
          path: site/dist
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: colibri-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: colibri-site
          path: site/dist
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure the CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure the CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
      - name: Deploy tested site to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.0'
          command: deploy --config site/wrangler.jsonc
      - name: Verify public assets
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://colibri.l3v.ai/ui/themes/colibri.css -o /tmp/colibri-live.css
          cmp site/dist/ui/themes/colibri.css /tmp/colibri-live.css

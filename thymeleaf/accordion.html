<div xmlns:th="http://www.thymeleaf.org" th:fragment="accordion(id, items, selected)" data-ui="accordion" data-type="single" th:id="${id}" th:attr="data-default-value=${selected}"><div data-ui-part="item" th:each="item : ${items}" th:attr="data-value=${item.value}"><h3><button type="button" data-ui-part="trigger" th:text="${item.label}">Section</button></h3><div data-ui-part="content" th:text="${item.text}">Content</div></div></div>

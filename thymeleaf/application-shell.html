<div xmlns:th="http://www.thymeleaf.org" th:fragment="component(model, content)" class="app-shell" data-application-component="shell"><aside class="app-nav suite-sidebar" data-app-part="sidebar"><button class="btn suite-close" type="button" data-app-part="close">Close menu</button><strong th:text="${model.brand}"></strong><nav class="suite-context" aria-label="Application navigation"><button th:each="page : ${model.pages}" type="button" class="btn" data-app-action="navigate" th:attr="data-id=${page.id}" th:text="${page.title}"></button></nav></aside><div class="app-stage"><header class="app-top"><button type="button" class="btn suite-menu" data-app-part="trigger" aria-expanded="false">Menu</button><strong th:text="${model.brand}"></strong></header><main class="app-main"><h1 data-app-heading="" th:text="${model.title}"></h1><p data-app-description="" th:text="${model.description}"></p><section th:replace="${content}"></section></main></div><button type="button" class="suite-backdrop" data-app-part="backdrop" aria-label="Close navigation" hidden></button></div>

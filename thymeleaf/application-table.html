<section xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="app-card" data-application-component="table"><header><h3 th:text="${model.title}"></h3><p th:text="${model.description}"></p></header><label>Search records<input type="search" data-app-filter="" aria-label="Search records"></label><div class="app-table-wrap"><table class="app-table"><caption th:text="${model.title}"></caption><thead><tr><th th:each="column : ${model.columns}" scope="col" th:text="${column}"></th><th scope="col">Actions</th></tr></thead><tbody><tr th:each="row : ${model.rows}" th:attr="data-record-id=${row.id}"><td th:each="cell : ${row.cells}" th:text="${cell}"></td><td><button class="btn" type="button" data-app-action="view-record" th:attr="data-id=${row.id}">View record</button></td></tr></tbody></table></div></section>

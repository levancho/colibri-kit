<article xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="app-card" data-application-component="article"><h2 th:text="${model.title}"></h2><p class="article-byline" th:text="${model.author}"></p><p th:text="${model.summary}"></p><ol class="article-steps"><li th:each="step : ${model.steps}"><h3 th:text="${step.title}"></h3><p th:text="${step.text}"></p></li></ol><a th:attr="href=${model.href}" th:text="${model.linkLabel}"></a></article>

<div xmlns:th="http://www.thymeleaf.org" th:fragment="tabs(id, label, items, selected)" data-ui="tabs" th:id="${id}" th:attr="data-default-value=${selected}"><div data-ui-part="list" th:attr="aria-label=${label}"><button type="button" data-ui-part="trigger" th:each="item : ${items}" th:attr="data-value=${item.value}" th:disabled="${item.disabled}" th:text="${item.label}">Tab</button></div><section data-ui-part="panel" th:each="item : ${items}" th:attr="data-value=${item.value}" th:text="${item.text}">Panel</section></div>

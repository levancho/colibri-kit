<section xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" data-application-component="products"><header><h3 th:text="${model.title}"></h3><p th:text="${model.description}"></p></header><div class="store-products"><article th:each="product : ${model.products}" class="store-product"><span class="product-photo" th:attr="data-product=${product.sprite}"><img width="320" height="180" loading="lazy" th:attr="src=${product.image},alt=${product.name}"></span><h3 th:text="${product.name}"></h3><p th:text="${product.price}"></p><small th:text="${product.stock}"></small><button class="btn" type="button" data-app-action="add-product" th:attr="data-id=${product.id}">Add to order</button></article></div><p role="status" data-cart-status="">No items added.</p></section>

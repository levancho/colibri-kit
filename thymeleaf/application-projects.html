<section xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" data-application-component="projects"><header><h3 th:text="${model.title}"></h3><p th:text="${model.description}"></p></header><div class="project-grid"><article th:each="project : ${model.projects}" class="project-card"><img width="320" height="180" loading="lazy" th:attr="src=${project.image},alt=${project.name}"><div class="project-body"><h3 th:text="${project.name}"></h3><p th:text="${project.description}"></p><label>Progress<progress max="100" th:attr="value=${project.progress}" th:text="${project.progress}"></progress></label><button class="btn" type="button" data-app-action="view-project" th:attr="data-id=${project.id}">View project</button></div></article></div></section>

<section xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="identity-card" data-application-component="identity"><span class="portrait portrait-large" data-face="3"><img width="320" height="180" loading="lazy" th:attr="src=${model.image},alt=${model.name}"></span><h3 th:text="${model.name}"></h3><p th:text="${model.role}"></p><dl><div th:each="detail : ${model.details}"><dt th:text="${detail.label}"></dt><dd th:text="${detail.value}"></dd></div></dl><button class="btn" type="button" data-app-action="edit-profile">Edit profile</button></section>

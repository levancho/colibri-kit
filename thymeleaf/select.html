<div xmlns:th="http://www.thymeleaf.org" th:fragment="select(id, name, label, items, selected)" data-ui="select" th:id="${id}" th:attr="data-name=${name},data-default-value=${selected}"><button type="button" data-ui-part="trigger" th:attr="aria-label=${label}"><span data-ui-part="value"></span></button><div data-ui-part="content" hidden><div data-ui-part="option" th:each="item : ${items}" th:attr="data-value=${item.value},data-disabled=${item.disabled ? 'true' : null}" th:text="${item.label}">Option</div></div></div>

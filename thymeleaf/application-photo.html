<section xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="workspace-lead" data-application-component="photo"><div class="workspace-story"><span class="eyebrow" th:text="${model.eyebrow}"></span><h2 th:text="${model.title}"></h2><p th:text="${model.description}"></p><a class="btn" th:attr="href=${model.href}" th:text="${model.linkLabel}"></a></div><img width="320" height="180" loading="lazy" th:attr="src=${model.image},alt=${model.imageAlt}"></section>

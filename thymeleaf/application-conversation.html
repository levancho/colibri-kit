<div xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="support-layout" data-application-component="conversation"><section class="support-queue" aria-label="Tickets"><button th:each="ticket : ${model.tickets}" class="support-ticket" type="button" data-app-action="select-ticket" th:attr="data-id=${ticket.id},aria-current=${ticket.id == model.selected.id}"><span class="portrait" th:attr="data-face=${ticket.face}"><img width="320" height="180" loading="lazy" th:attr="src=${ticket.image},alt=${ticket.customer}"></span><strong th:text="${ticket.customer}"></strong><p th:text="${ticket.title}"></p><small th:text="${ticket.status}"></small></button></section><article class="support-thread"><h2 data-ticket-title="" th:text="${model.selected.title}"></h2><p data-ticket-customer="" th:text="${model.selected.customer}"></p><label>Assigned to<select data-ticket-assignee="" aria-label="Assign ticket"><option value="Unassigned" th:selected="${model.selected.assigned == &quot;Unassigned&quot;}">Unassigned</option><option th:each="agent : ${model.agents}" th:selected="${agent == model.selected.assigned}" th:attr="value=${agent}" th:text="${agent}"></option></select></label><label>Status<select data-ticket-status="" aria-label="Ticket status"><option th:each="status : ${model.statuses}" th:selected="${status == model.selected.status}" th:attr="value=${status}" th:text="${status}"></option></select></label><div data-ticket-messages=""><div class="support-message"><p th:text="${model.selected.message}"></p></div></div><form class="app-form" data-app-form="reply"><label>Reply<textarea name="reply" required maxlength="2000"></textarea></label><button type="submit" class="btn">Save demo reply</button><p role="status"></p></form></article></div>

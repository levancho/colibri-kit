<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Grid samples · Colibri Kit</title>
    <link rel="stylesheet" href="/css/colibri.css">
    <link rel="stylesheet" href="/ui/themes/colibri.css" />
    <link rel="stylesheet" href="../grid.css" />
    <link rel="stylesheet" href="../workbench.css" />
    <link rel="stylesheet" href="../examples/trading/trading.css" />
    <link rel="stylesheet" href="gallery.css" />

    <link rel="stylesheet" href="/ui/themes/packs/index.css">
    <link rel="stylesheet" href="/kitchen-sink/examples/kit-bar.css">
    <link rel="stylesheet" href="/grid/kit-page.css">
    <script src="/grid/kit-theme.js"></script>
    <script type="module" src="/grid/kit-page.js"></script>
  <link rel="stylesheet" href="/grid/kit-grid-theme.css">
  </head>
  <body class="ui-root">
    <a class="grid-skip" href="#grid-content">Skip to grid content</a>
    <header class="kbar" data-active="grid">
      <button type="button" class="kbar-btn kbar-icon" data-kbar-tool id="theme" aria-label="Toggle dark mode">◐</button>
  <div data-kbar-custom data-title="Theme" hidden><label>Theme pack <select id="kit-theme" aria-label="Theme pack"><option value="">Colibri</option><option value="glacier">Glacier</option><option value="ember">Ember</option><option value="midnight">Midnight</option></select></label></div>
    </header>
    <nav class="kbar-sub" aria-label="Colibri Grid">
      <a data-section="samples" href="/grid/samples/" aria-current="page">Samples</a>
      <a data-section="react" href="#react-add-columns">React examples</a>
      <a data-section="trading" href="#trading-desk">Trading desk</a>
    </nav>
    <div class="studio">
      <aside>
        <div class="railhead">
          <h2>Examples</h2>
          <span id="total"></span>
        </div>
        <label class="sample-filter"
          ><span aria-hidden="true">⌕</span
          ><input id="find" type="search" aria-label="Find a sample" placeholder="Find an example…"
        /></label>
        <nav id="samples" aria-label="Grid samples"></nav>
      </aside>
      <main id="grid-content" tabindex="-1">
        <div class="gallery-preview">
          <div class="kpage-head">
            <div id="crumb" class="kpage-eyebrow"></div>
            <h1></h1>
            <p id="description"></p>
          </div>
          <section id="stage" aria-label="Interactive sample"></section>
        </div>
        <details id="application-source" class="implementation" hidden>
          <summary>Application source</summary>
          <label>File <select id="application-file"></select></label>
          <pre tabindex="0"><code id="application-code"></code></pre>
        </details>
        <details id="source" class="sink-code" open>
          <summary>Code</summary>
          <details class="implementation" id="implementation">
            <summary>View grid implementation</summary>
            <label>Source file
              <select id="implementation-file">
                <option value="../grid.js">JavaScript grid · grid.js</option>
                <option value="../integrations/react-grid.js">React grid · react-grid.js</option>
                <option value="choice-editor.js">Inline dropdown and tag editor · choice-editor.js</option>
                <option value="cells.js">Sample rows, columns and cell factories · cells.js</option>
                <option value="react/columns.jsx">React columns and editors · columns.jsx</option>
              </select>
            </label>
            <a id="open-file" href="../grid.js" target="_blank" rel="noopener">Open file ↗</a>
            <pre tabindex="0"><code id="implementation-code"></code></pre>
          </details>
          <div data-ui="tabs" class="sink-code-tabs" data-default-value="html">
            <div data-ui-part="list" aria-label="Sample source code">
              <button data-ui-part="trigger" data-value="html">HTML</button>
              <button data-ui-part="trigger" data-value="react">React</button>
              <button data-ui-part="trigger" data-value="ftl">FreeMarker</button>
              <button data-ui-part="trigger" data-value="thymeleaf">Thymeleaf</button>
            </div>
            <div data-ui-part="panel" data-value="html" hidden>
              <button class="sink-copy" data-ui="clipboard" data-target="#code-html" aria-label="Copy HTML code"><span class="sink-copy-l">Copy</span></button>
              <pre class="sink-pre" tabindex="0"><code id="code-html"></code></pre>
            </div>
            <div data-ui-part="panel" data-value="react" hidden>
              <button class="sink-copy" data-ui="clipboard" data-target="#code-react" aria-label="Copy React code"><span class="sink-copy-l">Copy</span></button>
              <pre class="sink-pre" tabindex="0"><code id="code-react"></code></pre>
              <div class="source-links">
                <a id="run-react">Open this React example</a>
                <a href="react/columns.jsx" download>Column definitions and editors</a>
                <a href="cells.js" download>Sample data and cell renderers</a>
              </div>
            </div>
            <div data-ui-part="panel" data-value="ftl" hidden>
              <button class="sink-copy" data-ui="clipboard" data-target="#code-ftl" aria-label="Copy FreeMarker code"><span class="sink-copy-l">Copy</span></button>
              <pre class="sink-pre" tabindex="0"><code id="code-ftl"></code></pre>
            </div>
            <div data-ui-part="panel" data-value="thymeleaf" hidden>
              <button class="sink-copy" data-ui="clipboard" data-target="#code-thymeleaf" aria-label="Copy Thymeleaf code"><span class="sink-copy-l">Copy</span></button>
              <pre class="sink-pre" tabindex="0"><code id="code-thymeleaf"></code></pre>
            </div>
          </div>
        </details>
      </main>
    </div>
    <script src="../grid.js"></script>
    <script type="module" src="gallery.js"></script>
  </body>
</html>

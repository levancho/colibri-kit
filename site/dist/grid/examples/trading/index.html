<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trading desk · Colibri Grid</title>
    <link rel="stylesheet" href="/ui/themes/colibri.css" />
    <link rel="stylesheet" href="../../grid.css" />
    <link rel="stylesheet" href="trading.css" />
  </head>
  <body class="ui-root">
    <header class="sitebar">
      <a href="../../samples/" class="brand"
        ><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Colibri Grid</a
      ><span class="crumb">/</span><span>Examples</span><span class="session"><i></i>Simulated feed</span>
    </header>
    <main>
      <div class="top">
        <div>
          <h1>Trading desk</h1>
          <p>Equity quotes and foreign exchange</p>
        </div>
        <div class="controls">
          <label
            >Exchange<select id="market" aria-label="Exchange">
              <option>Nasdaq</option>
              <option>NYSE</option>
            </select></label
          >
          <details class="settings">
            <summary>Feed settings</summary>
            <div>
              <label
                >Instruments<select id="size" aria-label="Instruments">
                  <option value="1000">1,000</option>
                  <option value="10000" selected>10,000</option>
                  <option value="50000">50,000</option>
                </select></label
              >
              <label
                >Ticks per visible equity / sec<select id="rate" aria-label="Ticks per visible equity / sec">
                  <option value="2" selected>2</option>
                  <option value="5">5</option>
                  <option value="15">15</option>
                </select></label
              >
            </div>
          </details>
          <button id="pause" type="button">Pause feed</button>
        </div>
      </div>
      <div class="desk">
        <section class="panel stocks">
          <header>
            <h2>Market watch</h2>
            <div id="search-slot"></div>
          </header>
          <div id="stock-grid"></div>
          <footer><span id="watch-count"></span><span id="throughput"></span></footer>
        </section>
        <section class="panel detail">
          <header>
            <h2>Instrument detail</h2>
            <span id="venue"></span>
          </header>
          <div class="detail-body">
            <div class="identity"><strong id="symbol"></strong><span id="company"></span></div>
            <div class="quote"><strong id="price"></strong><span id="change"></span></div>
            <div class="chart-head">
              <span>Price history</span>
              <div id="ranges" aria-label="Chart range">
                <button data-min="1">1m</button><button data-min="5" aria-pressed="true">5m</button
                ><button data-min="15">15m</button>
              </div>
            </div>
            <canvas id="history" role="img" aria-label="Instrument price history"></canvas>
            <dl>
              <div>
                <dt>Open</dt>
                <dd id="open"></dd>
              </div>
              <div>
                <dt>Day low</dt>
                <dd id="low"></dd>
              </div>
              <div>
                <dt>Day high</dt>
                <dd id="high"></dd>
              </div>
              <div>
                <dt>Prev. close</dt>
                <dd id="close"></dd>
              </div>
            </dl>
          </div>
        </section>
        <section class="panel heat">
          <header>
            <h2>FX cross rates</h2>
            <span>Quote per unit of base</span>
          </header>
          <div id="fx-grid"></div>
        </section>
        <section class="panel movers">
          <header>
            <h2>Currency movers</h2>
            <span>USD and EUR crosses</span>
          </header>
          <div id="movers-grid"></div>
        </section>
      </div>
      <footer class="bottom">
        <span>Colibri Grid <b> / </b> Trading example</span><time id="clock"></time>
      </footer>
    </main>
    <script src="../../grid.js"></script>
    <script type="module" src="trading.js"></script>
  </body>
</html>

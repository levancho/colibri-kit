<section xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="app-card" data-application-component="board"><header><h3 th:text="${model.title}"></h3><p th:text="${model.description}"></p></header><div class="pipeline"><section th:each="lane : ${model.lanes}" class="lane"><h4 th:text="${lane.title}"></h4><button th:each="deal : ${lane.deals}" class="deal" type="button" data-app-action="edit-deal" th:attr="data-id=${deal.id}"><strong th:text="${deal.company}"></strong><p th:text="${deal.value}"></p><small th:text="${deal.owner}"></small></button></section></div></section>

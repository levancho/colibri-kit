<table xmlns:th="http://www.thymeleaf.org" th:fragment="customer_table(customers)" class="data"><thead><tr><th scope="col">Customer</th><th scope="col">Plan</th><th scope="col">MRR</th></tr></thead><tbody><tr th:each="customer : ${customers}"><td th:text="${customer.name}">Name</td><td th:text="${customer.plan}">Plan</td><td th:text="${customer.mrr}">0</td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="3">No customers yet</td></tr></tbody></table>

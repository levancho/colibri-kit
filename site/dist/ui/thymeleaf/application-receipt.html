<section xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="sales-receipt" data-application-component="receipt"><header><h3 th:text="${model.title}"></h3><p th:text="${model.description}"></p></header><dl><div th:each="item : ${model.items}"><dt th:text="${item.label}"></dt><dd th:text="${item.amount}"></dd></div></dl><p>Total: <strong th:text="${model.total}"></strong></p><button class="btn" type="button" data-app-action="download-receipt">Download receipt</button></section>

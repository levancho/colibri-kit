<div xmlns:th="http://www.thymeleaf.org" th:fragment="dialog(id, trigger, title, description, content)" data-ui="dialog" th:id="${id}"><button type="button" data-ui-part="trigger" th:text="${trigger}">Open</button><dialog data-ui-part="content"><h2 data-ui-part="title" th:text="${title}">Title</h2><p data-ui-part="description" th:if="${description != null}" th:text="${description}">Description</p><div th:insert="${content}"></div><button type="button" data-ui-part="close">Close</button></dialog></div>

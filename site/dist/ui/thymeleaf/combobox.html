<div xmlns:th="http://www.thymeleaf.org" th:fragment="combobox(id, name, label, items)" data-ui="combobox" th:id="${id}" th:attr="data-name=${name}"><input data-ui-part="input" th:attr="aria-label=${label}" th:placeholder="${label}"><button type="button" data-ui-part="trigger" aria-label="Show options"></button><div data-ui-part="content" hidden><div data-ui-part="option" th:each="item : ${items}" th:attr="data-value=${item.value}" th:text="${item.label}">Option</div><div data-ui-part="empty">No results</div></div></div>

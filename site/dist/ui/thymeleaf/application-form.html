<form xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="app-form" data-app-form="profile" method="post" data-application-component="form" th:attr="action=${model.action}"><h3 th:text="${model.title}"></h3><label th:each="field : ${model.fields}"><span th:text="${field.label}"></span><input required maxlength="100" th:attr="name=${field.name},type=${field.type},value=${field.value}"></label><button class="btn" type="submit" th:text="${model.submitLabel}"></button><p role="status"></p></form>

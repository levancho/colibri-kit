<section xmlns:th="http://www.thymeleaf.org" th:fragment="component(model)" class="workspace-day" data-application-component="planner"><header><h3 th:text="${model.title}"></h3><p th:text="${model.description}"></p></header><div class="agenda-list"><article th:each="event : ${model.events}" class="agenda-item"><time th:attr="datetime=${event.datetime}" th:text="${event.time}"></time><div><h4 th:text="${event.title}"></h4><p th:text="${event.location}"></p><button class="btn" type="button" data-app-action="view-event" th:attr="data-id=${event.id}">View event</button></div></article></div></section>

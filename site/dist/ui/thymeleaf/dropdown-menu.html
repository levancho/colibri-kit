<div xmlns:th="http://www.thymeleaf.org" th:fragment="dropdown_menu(label, items)" data-ui="dropdown-menu"><button type="button" data-ui-part="trigger" th:text="${label}">Actions</button><div data-ui-part="content" hidden><button type="button" data-ui-part="item" th:each="item : ${items}" th:attr="data-value=${item.value}" th:disabled="${item.disabled}" th:text="${item.label}">Action</button></div></div>

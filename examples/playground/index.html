<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Themes Studio — Colibri Kit</title>
<style>
:root{--bg:#f6f7f9;--fg:#0f1419;--muted:#5d6876;--line:#e3e6eb;--card:#fff;--soft:#eef1f5;--acc:#3b5bdb;color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-chrome=dark]{--bg:#0c0f14;--fg:#e8ecf2;--muted:#8d97a5;--line:#1e242d;--card:#12161d;--soft:#181d26;--acc:#7c95ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-size:13px;height:100vh;display:grid;grid-template-rows:auto 1fr}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:inherit;text-decoration:none}.brand i{width:20px;height:20px;border-radius:6px;background:conic-gradient(from 200deg,#3b5bdb,#22b8cf,#f59f00,#e64980,#3b5bdb)}
.brand span{font-weight:500;color:var(--muted)}.top nav{display:flex;gap:2px;margin-left:8px}.top nav a{padding:6px 10px;border-radius:7px;color:var(--muted);text-decoration:none}.top nav a:hover,.top nav a[aria-current]{background:var(--soft);color:var(--fg)}
.top .sp{flex:1}.ib{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;height:30px;padding:0 10px;font:inherit;cursor:pointer}
.wrap{display:grid;grid-template-columns:300px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);overflow:auto;padding:14px 16px 40px;background:var(--card)}
.rail h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between}.rail h3:first-child{margin-top:4px}
.rail h3 button{border:0;background:none;color:var(--acc);font:inherit;letter-spacing:0;text-transform:none;cursor:pointer}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pack{position:relative;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);cursor:pointer;text-align:left;color:inherit;font:inherit}
.pack[aria-checked=true]{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.pack .sw{height:46px;border-radius:8px;margin-bottom:6px;display:grid;grid-template-columns:2fr 1fr;gap:4px;padding:6px;background:var(--p-bg)}
.pack .sw b{border-radius:var(--p-r);background:var(--p-card);box-shadow:var(--p-sh)}.pack .sw s{border-radius:var(--p-r);background:var(--p-acc);text-decoration:none}
.pack strong{display:block;font-size:12px}.pack small{color:var(--muted);font-size:11px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:6px 4px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button[aria-checked=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px #0002;font-weight:600}
.hues{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.hues button{aspect-ratio:1;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c);padding:0}
.hues button[aria-checked=true]{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--card)}.hues button.auto{background:conic-gradient(#e64980,#f59f00,#40c057,#22b8cf,#3b5bdb,#e64980)}
input[type=range]{width:100%;accent-color:var(--acc)}select{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;padding:0 8px}
.lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:6px}
.stage{display:grid;grid-template-rows:auto 1fr auto;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}.bar .sum{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px}.dev button{display:grid;place-items:center;width:34px;height:28px;border:0;border-radius:7px;background:none;color:var(--muted);cursor:pointer}.dev button[aria-checked=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px #0002}
.dev svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.view{overflow:auto;padding:18px;display:grid;justify-items:center;align-items:start;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--muted) 22%,transparent) 1px,transparent 0) 0 0/16px 16px}
.frame{width:100%;height:100%;min-height:640px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 20px 60px -30px #0005;transition:width .35s cubic-bezier(.3,.7,.2,1)}
.frame[data-device=tablet]{width:768px;height:1024px;border:10px solid #15181d;border-radius:28px}.frame[data-device=phone]{width:390px;height:844px;border:10px solid #15181d;border-radius:44px}
.frame iframe{width:100%;height:100%;border:0;display:block}
.code{border-top:1px solid var(--line);background:var(--card);display:grid;grid-template-rows:auto 1fr;max-height:44vh;min-height:44px}
.code[data-open=false]{max-height:44px}.code[data-open=false] .cbody{display:none}
.ctabs{display:flex;align-items:center;gap:2px;padding:6px 12px}.ctabs button{border:0;background:none;color:var(--muted);font:inherit;padding:6px 10px;border-radius:7px;cursor:pointer}.ctabs button[aria-selected=true]{background:var(--soft);color:var(--fg);font-weight:600}
.ctabs .sp{flex:1}.cbody{overflow:auto;padding:0 12px 12px}.cbody pre{margin:0;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.rail{max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}.top nav{display:none}}
</style></head>
<body>
<header class="top"><a class="brand" href="/"><i></i>Colibri Kit <span>/ Themes Studio</span></a>
 <nav aria-label="Kit"><a href="/kitchen-sink/examples/kitchen-sink.html">Components</a><a href="/kitchen-sink/examples/blocks/">Blocks</a><a href="/kitchen-sink/examples/dashboards/">Dashboards</a><a href="./" aria-current="page">Studio</a></nav>
 <span class="sp"></span><button class="ib" id="share" type="button">Copy link</button><button class="ib" id="chrome" type="button" aria-label="Toggle studio light/dark">◐</button></header>
<div class="wrap">
<aside class="rail" aria-label="Theme settings">
 <h3>Theme pack <button type="button" id="reset">Reset all</button></h3>
 <div class="packs" role="radiogroup" aria-label="Theme pack" id="packs"></div>
 <h3>Colour</h3>
 <div class="hues" role="radiogroup" aria-label="Accent colour" id="hues"></div>
 <input type="range" id="hue" min="0" max="360" value="255" aria-label="Custom hue"><div class="lbl"><span>Custom hue</span><output id="hue-o">pack default</output></div>
 <h3>Gray tint</h3><div class="seg" role="radiogroup" data-k="gray" data-opts="auto:Auto,slate:Slate,sage:Sage,sand:Sand,mauve:Mauve"></div>
 <h3>Appearance</h3><div class="seg" role="radiogroup" data-k="scheme" data-opts="light:Light,dark:Dark"></div>
 <h3>Radius</h3><div class="seg" role="radiogroup" data-k="radius" data-opts="pack:Pack,0:None,4:Small,8:Medium,14:Large,999:Full"></div>
 <h3>Density</h3><div class="seg" role="radiogroup" data-k="scaling" data-opts="90:90%,95:95%,100:100%,105:105%,110:110%"></div>
 <h3>Panel</h3><div class="seg" role="radiogroup" data-k="panel" data-opts="solid:Solid,translucent:Translucent"></div>
 <h3>Type</h3><select id="font" aria-label="Typeface"><option value="pack">Pack default</option><option value='ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif'>System sans</option><option value='"Inter","Geist",ui-sans-serif,system-ui,sans-serif'>Inter / Geist</option><option value='"Avenir Next","Nunito","Segoe UI",sans-serif'>Rounded humanist</option><option value='"Iowan Old Style","Charter",Georgia,serif'>Editorial serif</option><option value='ui-monospace,SFMono-Regular,Menlo,monospace'>Monospace</option><option value='"Noto Sans Georgian","BPG Arial",sans-serif'>Georgian (Noto)</option></select>
 <h3>Motion</h3><div class="seg" role="radiogroup" data-k="motion" data-opts="off:Off,calm:Calm,pack:Pack,lively:Lively"></div>
</aside>
<section class="stage" aria-label="Preview">
 <div class="bar"><span class="sum" id="sum"></span>
  <div class="dev" role="radiogroup" aria-label="Preview device" id="dev">
   <button type="button" role="radio" data-d="desktop" aria-label="Desktop"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="13" rx="2"/><path d="M8 21h8M12 16v5"/></svg></button>
   <button type="button" role="radio" data-d="tablet" aria-label="Tablet (768px)"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/></svg></button>
   <button type="button" role="radio" data-d="phone" aria-label="Phone (390px)"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></button></div></div>
 <div class="view"><div class="frame" id="frame" data-device="desktop"><iframe id="pv" src="preview.html" title="Live theme preview"></iframe></div></div>
 <div class="code" id="code" data-open="true">
  <div class="ctabs" role="tablist" aria-label="Export"><button role="tab" data-l="html" aria-selected="true">HTML</button><button role="tab" data-l="ftl" aria-selected="false">FreeMarker</button><button role="tab" data-l="react" aria-selected="false">React</button><button role="tab" data-l="css" aria-selected="false">CSS tokens</button><span class="sp"></span><button id="copy" type="button">Copy</button><button id="toggle" type="button" aria-expanded="true">Hide code</button></div>
  <div class="cbody"><div id="out" data-lang="html"><pre><code></code></pre></div></div></div>
</section></div>
<script type="module" src="playground.js"></script>
</body></html>
